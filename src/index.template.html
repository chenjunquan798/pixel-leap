<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="game" width="480" height="720" tabindex="-1" role="img" aria-label="游戏画面"></canvas>

    <div class="hud" id="hud" hidden>
      <div class="hud-left">
        <b class="hud-score" id="hud-score">0</b>
        <span class="hud-height" id="hud-height">0 m</span>
      </div>
      <div class="hud-right">
        <span class="pill" id="hud-stars">
          <span class="star-ico" aria-hidden="true">★</span><span id="hud-star-count">0</span>
        </span>
        <button class="icon-btn" id="btn-pause" type="button" aria-label="暂停">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>
        </button>
        <button class="icon-btn" id="btn-mute" type="button" aria-label="静音" aria-pressed="false">
          <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16 8.5v7M19 10.5v3" class="stroke"></path></svg>
          <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 9.5l5 5m0-5l-5 5" class="stroke"></path></svg>
        </button>
      </div>
    </div>

    <div class="touch" id="touch" hidden aria-hidden="true">
      <button class="touch-btn" id="touch-left" type="button" tabindex="-1">‹</button>
      <button class="touch-btn" id="touch-right" type="button" tabindex="-1">›</button>
    </div>

    <div class="screen" id="screen-menu">
      <div class="panel menu-panel">
        <p class="kicker" data-i18n="menu.kicker">零安装 · 再来一局</p>
        <h1 class="logo" aria-label="像素跳跳乐 Pixel Leap"><span>PIXEL</span><span class="logo-2">LEAP</span></h1>
        <p class="subtitle">像素跳跳乐</p>
        <p class="best-line"><span data-i18n="menu.best">最高分</span><b id="menu-best">0</b></p>
        <button class="btn btn-primary" id="btn-start" type="button" data-i18n="menu.start">开始跳跃</button>
        <p class="controls"><kbd>←</kbd><kbd>→</kbd><span class="sep">/</span><kbd>A</kbd><kbd>D</kbd><span data-i18n="menu.controls">移动</span></p>
        <p class="touch-hint" data-i18n="menu.touch">触屏：按住屏幕左右两侧移动</p>
        <p class="tagline" data-i18n="menu.tagline">打开即玩 · 无广告 · 无登录</p>
        <div class="menu-foot">
          <button class="link-btn" id="btn-sound" type="button" data-i18n="menu.soundOn">音效 开</button>
          <span class="dot" aria-hidden="true">·</span>
          <button class="link-btn" id="btn-lang" type="button" data-i18n="menu.lang">EN</button>
          <span class="dot" aria-hidden="true">·</span>
          <a class="link-btn" href="privacy.html" data-i18n="menu.privacy">隐私</a>
          <span class="dot" aria-hidden="true">·</span>
          <span class="version">v2.0</span>
        </div>
      </div>
    </div>

    <div class="screen" id="screen-pause" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="panel narrow">
        <p class="kicker" data-i18n="pause.kicker">PAUSED</p>
        <h2 id="pause-title" data-i18n="pause.title">暂停</h2>
        <p class="hint" data-i18n="pause.hint">喘口气，星星不会跑。</p>
        <button class="btn btn-primary" id="btn-resume" type="button" data-i18n="pause.resume">继续</button>
        <button class="btn" id="btn-pause-restart" type="button" data-i18n="pause.restart">重开</button>
        <button class="btn btn-ghost" id="btn-pause-home" type="button" data-i18n="pause.home">回首页</button>
      </div>
    </div>

    <div class="screen" id="screen-over" hidden role="dialog" aria-modal="true" aria-labelledby="over-title">
      <div class="panel over-panel">
        <p class="kicker" data-i18n="over.kicker">RUN COMPLETE</p>
        <h2 id="over-title" data-i18n="over.title">本局结束</h2>
        <p class="record-badge" id="over-record" hidden data-i18n="over.record">新纪录！</p>
        <p class="score-big"><span id="over-score">0</span><small data-i18n="over.points">分</small></p>
        <dl class="stats">
          <div><dt data-i18n="over.height">高度</dt><dd id="over-height">0 m</dd></div>
          <div><dt data-i18n="over.stars">星星</dt><dd id="over-stars">0</dd></div>
          <div><dt data-i18n="over.best">最高分</dt><dd id="over-best">0</dd></div>
        </dl>
        <p class="diff" id="over-diff"></p>
        <button class="btn btn-primary" id="btn-retry" type="button" data-i18n="over.retry">再来一次</button>
        <button class="btn btn-share" id="btn-share" type="button" hidden data-i18n="over.share">分享成绩</button>
        <button class="btn btn-ghost" id="btn-home" type="button" data-i18n="over.home">返回首页</button>
      </div>
    </div>

    <div class="screen" id="screen-fatal" hidden role="alertdialog" aria-labelledby="fatal-title">
      <div class="panel narrow">
        <h2 id="fatal-title" data-i18n="error.title">游戏加载失败，请刷新重试。</h2>
        <p class="hint" data-i18n="error.body">画面初始化没有成功。刷新页面即可重新开始。</p>
        <button class="btn btn-primary" id="btn-refresh" type="button" data-i18n="error.refresh">刷新页面</button>
      </div>
    </div>

    <div class="zone-toast" id="zone-toast" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <p class="sr-only" id="live" aria-live="polite" aria-atomic="true"></p>
  </main>
